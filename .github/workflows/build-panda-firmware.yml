name: Build panda firmware

on:
  workflow_dispatch:
  push:
    branches: [crosstrek]
    paths:
      - 'panda/**'
      - 'opendbc_repo/opendbc/safety/**'

permissions:
  contents: write

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ARM toolchain
        run: sudo apt-get install -y gcc-arm-none-eabi

      - name: Setup panda build environment
        run: cd panda && ./setup.sh

      - name: Build panda firmware
        run: cd panda && source .venv/bin/activate && scons

      - name: Commit firmware binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add panda/board/obj/panda_h7.bin.signed
          git diff --cached --quiet || (git commit -m "chore: rebuild panda firmware [skip ci]" && git push)
